# JoyStream AI 26A: mejoras aditivas para desarrollo LOCAL.
# Docker Compose carga automáticamente compose.override.yaml junto a compose.yaml.
services:
  db:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joystream -d joystream"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  backend:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  monitor:
    restart: unless-stopped
