# JoyStream AI 26A: mejoras aditivas para desarrollo LOCAL.
# Docker Compose carga automáticamente compose.override.yaml junto a compose.yaml.
services:
  db:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joystream -d joystream"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  backend:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  monitor:
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      INFO: "1"
      SYSTEM: "1"
      VOLUMES: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  nagios:
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ./monitoring/nagios/plugins:/opt/nagios/libexec/joystream:ro
