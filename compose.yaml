services:
  
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
      - ./.joystream-auth.env
      - ./.joystream-internal.env
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      TWITCH_REDIRECT_URI: http://localhost:8000/auth/twitch/callback
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  db:
    image: postgres:16
    environment:
      POSTGRES_USER: joystream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: joystream
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joystream -d joystream"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./dashboard/app.py:/app/app.py
    depends_on:
      - backend


  scheduler:
    env_file:
      - ./.joystream-internal.env
    build: ./scheduler
    environment:
      API_URL: http://backend:8000
      SYNC_INTERVAL_SECONDS: 21600
    depends_on:
      - backend
    restart: unless-stopped

  
  monitor:
    build: ./backend
    command: python -u -m app.monitor
    env_file:
      - .env
    environment:
      MONITOR_INTERVAL_SECONDS: 60
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped



  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres_data:
  ollama_data:

