# JOYSTREAM_26B_DYNAMIC_DNS
# Protege peticiones web con Origin ajeno; no reemplaza autenticación.
map $http_origin $joy26b_bad_origin {
    default 1;
    "" 0;
    ~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$ 0;
}
map $http_sec_fetch_site $joy26b_bad_fetch_site {
    default 0;
    cross-site 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # JOYSTREAM_26B_DYNAMIC_DNS
        # DNS de Docker: re-resuelve el servicio tras recrear el contenedor.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $joy26b_backend backend;
        # Antes de proxy_pass, quitar /api/ preservando la ruta y query original.
        if ($joy26b_bad_origin) { return 403; }
        if ($joy26b_bad_fetch_site) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$joy26b_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
