# ==========================================
# JOYSTREAM AI - MONITORIZACION
# ==========================================

define command {
    command_name check_joystream_http
    command_line $USER1$/check_http -H $ARG1$ -p $ARG2$ -u $ARG3$ -w 3 -c 8
}

define command {
    command_name check_joystream_tcp
    command_line $USER1$/check_tcp -H $ARG1$ -p $ARG2$ -w 3 -c 8
}

define command {
    command_name check_joystream_container
    command_line /usr/bin/python3 /opt/nagios/libexec/joystream/check_joystream_docker.py --container "$ARG1$" --warning-mb "$ARG2$" --critical-mb "$ARG3$" --warning-cpu "$ARG4$" --critical-cpu "$ARG5$"
}

define command {
    command_name check_joystream_system
    command_line /usr/bin/python3 /opt/nagios/libexec/joystream/check_joystream_system.py --metric $ARG1$ --warning $ARG2$ --critical $ARG3$
}

define host {
    use linux-server
    host_name joystream-ai
    alias JoyStream AI
    address backend
    check_command check_joystream_http!backend!8000!/health
}

# SERVICIOS PRINCIPALES

define service {
    use local-service
    host_name joystream-ai
    service_description FastAPI Backend
    check_command check_joystream_http!backend!8000!/health
}

